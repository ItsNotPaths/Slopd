name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string
      notes:
        description: 'Release notes'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

env:
  PROJECT_NAME: Slopd

# Linux only, deliberately. Slopd owns its PTY through core:sys/posix and the libvterm
# bindings #panic off POSIX; the Clay bindings do the same (bindings/clay/clay.odin).
# The Windows job this workflow used to carry never produced a working binary.

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # TODO: if you need an older glibc floor, switch to a container like:
    #   container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache vendor/
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-linux-${{ hashFiles('download-deps.sh') }}

      # download-deps.sh needs fontTools to subset the bundled Iosevka face; without it
      # it embeds the full ~8.9MB font and the release binary ships at ~10.5MB instead
      # of ~1.9MB. The runner has no fontTools by default, so install it BEFORE deps.
      - name: Install fontTools
        run: python3 -m pip install --user fonttools

      - name: Download deps
        run: |
          chmod +x ./download-deps.sh
          ./download-deps.sh

      - name: Install toolchain
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          # -define:GLFW_SHARED=false links vendor/glfw/lib/libglfw3.a, so the release
          # binary uses the GLFW we vendor rather than whatever libglfw the runner has
          # (and users then need at run time). Matches release.sh --local.
          odin build src -out:"$PROJECT_NAME" -o:speed -define:GLFW_SHARED=false
          strip --strip-all "$PROJECT_NAME"

      - name: Stage artifacts
        run: |
          mkdir -p dist
          # TODO: copy the files you want in the linux release into dist/
          [ -f "$PROJECT_NAME" ] && cp "$PROJECT_NAME" dist/ || true
          [ -d dist-stage ] && cp -r dist-stage/. dist/ || true
          [ -f README.md ] && cp README.md dist/ || true
          [ -f LICENSE ] && cp LICENSE dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: dist

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-zip
          path: linux-zip

      - name: Package
        run: |
          (cd linux-zip && zip -r "../${PROJECT_NAME}-linux.zip" .)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ inputs.version }}" \
              "${PROJECT_NAME}-linux.zip" \
              --title "${{ inputs.version }}" \
              --notes "${{ inputs.notes }}" \
              $PRERELEASE_FLAG
