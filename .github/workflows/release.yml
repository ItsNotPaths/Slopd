name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string
      notes:
        description: 'Release notes'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

env:
  # The binary is `slopd`, not the project's name: lower case, because it is what you type.
  # It is also the app-id the window reports (APP_ID in src/slopd/main.odin), the name `--install`
  # writes to ~/.local/bin, and the name slopd.desktop calls in Exec. Matches release.sh.
  BIN_NAME: slopd

# Linux only, deliberately. Slopd owns its PTY through core:sys/posix and the libvterm
# bindings #panic off POSIX; the Clay bindings do the same (bindings/clay/clay.odin).
# The Windows job this workflow used to carry never produced a working binary.

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # TODO: if you need an older glibc floor, switch to a container like:
    #   container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache vendor/
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-linux-${{ hashFiles('download-deps.sh') }}

      # download-deps.sh builds glfw 3.4 from source, which compiles the X11 and Wayland
      # backends by default; the runner ships neither set of headers. GLFW dlopens both
      # at run time, so this only affects the build, not what the release binary needs.
      - name: Install glfw build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev xorg-dev

      # download-deps.sh needs fontTools to subset the bundled Iosevka face; without it
      # it embeds the full ~8.9MB font and the release binary ships at ~10.5MB instead
      # of ~1.9MB. The runner has no fontTools by default, so install it BEFORE deps.
      - name: Install fontTools
        run: python3 -m pip install --user fonttools

      # Must precede Download deps: the script's glfw step shells out to `odin root`
      # to install libglfw3.a into the Odin tree, where the stock bindings look.
      - name: Install toolchain
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download deps
        run: |
          chmod +x ./download-deps.sh
          ./download-deps.sh

      - name: Build
        run: |
          # -define:GLFW_SHARED=false links vendor/glfw/lib/libglfw3.a, so the release
          # binary uses the GLFW we vendor rather than whatever libglfw the runner has
          # (and users then need at run time). Matches release.sh --local.
          # SLOPD_VERSION stamps the tag into `slopd --version`. The quotes are ESCAPED so
          # Odin receives them: -define parses its value, and a tag like `2.0` read bare
          # becomes a float. about.odin takes the quotes back off.
          odin build src/slopd -out:"$BIN_NAME" -o:speed -define:GLFW_SHARED=false \
              -define:SLOPD_VERSION='"${{ inputs.version }}"'
          strip --strip-all "$BIN_NAME"

      - name: Stage artifacts
        run: |
          mkdir -p dist
          # THE RELEASE IS ONE BINARY. The language registry, the default theme, the default
          # slopd.config, the launcher entry and its icon, the README and the LICENSE are all
          # #load-ed into the executable, so there is nothing to ship beside it and nothing a
          # user can lose by moving it. `slopd --install` writes the config out; `--desktop
          # add` writes the launcher entry out. themes/ and grammars/ the install creates.
          cp "$BIN_NAME" dist/
          # install.sh rides along so the one-liner in the README can point at a RELEASE
          # rather than at whatever is on main.
          cp install.sh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: dist

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-assets
          path: dist

      # No archive step. Both assets are uploaded RAW, because both are downloaded one at a
      # time by a script that has nothing but curl:
      #   .../releases/latest/download/slopd       the binary, chmod +x and run
      #   .../releases/latest/download/install.sh  the one-liner in the README
      # A zip would add an `unzip` dependency to an installer whose whole point is not
      # needing one.
      #
      # This job never checks out, so gh has no git remote to infer the repo from:
      # GH_REPO supplies it, and --target pins the new tag to the dispatched commit
      # rather than whatever the default branch happens to point at.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          chmod +x dist/install.sh
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ inputs.version }}" \
              "dist/${BIN_NAME}" \
              "dist/install.sh" \
              --target "${{ github.sha }}" \
              --title "${{ inputs.version }}" \
              --notes "${{ inputs.notes }}" \
              $PRERELEASE_FLAG
